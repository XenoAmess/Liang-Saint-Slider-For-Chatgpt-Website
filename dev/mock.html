<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑动变祖器 · ChatGPT 弹层 Mock</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f7f7f8; margin: 0; padding: 40px; color: #0d0d0d; }
  h1 { font-size: 18px; }
  .composer { max-width: 720px; margin: 120px auto 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 24px; padding: 16px; position: relative; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border: none; background: #f1f1f1; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .pill:hover { background: #e8e8e8; }
  /* Radix Popper 风格弹层 */
  [data-radix-popper-content-wrapper] { position: absolute; bottom: 56px; right: 24px; z-index: 50; }
  .popover-content { background: #fff; border: 1px solid #ececec; border-radius: 16px; box-shadow: 0 8px 30px rgb(0 0 0/12%); padding: 12px; width: 260px; box-sizing: border-box; }
  /* Radix Slider 风格 */
  .mock-slider { position: relative; display: flex; align-items: center; width: 100%; height: 20px; touch-action: none; user-select: none; }
  .mock-track { position: relative; flex: 1; height: 6px; border-radius: 999px; background: #e5e5e5; overflow: hidden; }
  .mock-range { position: absolute; left: 0; top: 0; bottom: 0; background: #0d0d0d; border-radius: 999px; }
  .mock-thumb { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1px solid #d0d0d0; box-shadow: 0 1px 3px rgb(0 0 0/15%); margin-left: -8px; }
  .mock-thumb:focus-visible { outline: 2px solid #4d6bfe; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; }
  .row .adv { color: #6f6f6f; text-decoration: none; }
  .apply { border: 1px solid #d9d9d9; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  /* 变体 C：模拟真实站点的苛刻弹层——flex 列布局 + 固定小高度 + overflow 裁剪 */
  .popover-content.tight { display: flex; flex-direction: column; height: 96px; overflow: hidden; }
  .debug { max-width: 720px; margin: 24px auto; font-family: Consolas, monospace; font-size: 12px; color: #555; white-space: pre-wrap; }
  .hint { max-width: 720px; margin: 8px auto; font-size: 12px; color: #888; }
</style>
</head>
<body>
<h1>Mock：ChatGPT 思考强度弹层</h1>
<p class="hint">本页模拟 chatgpt.com「5.6 Sol 高」弹层结构（Radix 式 role=slider + 一个 input[type=range] 变体），
直接通过 &lt;script src&gt; 加载仓库根目录的 <code>liang-saint-slider.user.js</code> 来离线验证脚本逻辑。
帧素材走 <code>window.__LIANG_FRAME_BASE__ = '../frames/'</code>。</p>

<div class="composer">
  <!-- 变体 A：Radix 式 role=slider（4 档：0..3） -->
  <button class="pill" id="pillA">5.6 Sol <span id="pillAEffort">高</span> ▾</button>
  <div data-radix-popper-content-wrapper id="popA" hidden>
    <div class="popover-content">
      <span class="mock-slider" id="sliderA">
        <span class="mock-track"><span class="mock-range" id="rangeA"></span></span>
        <span class="mock-thumb" id="thumbA" role="slider" tabindex="0"
              aria-valuemin="0" aria-valuemax="3" aria-valuenow="2" aria-label="思考强度"></span>
      </span>
      <div class="row"><a class="adv" href="#">高级 ›</a><button class="apply">应用</button></div>
    </div>
  </div>
</div>

<div class="composer">
  <!-- 变体 B：原生 input[type=range]（4 档：0..3） -->
  <button class="pill" id="pillB">5.6 Sol <span id="pillBEffort">高</span> ▾</button>
  <div data-radix-popper-content-wrapper id="popB" hidden>
    <div class="popover-content">
      <input type="range" id="sliderB" min="0" max="3" step="1" value="2" aria-label="思考强度" style="width:100%">
      <div class="row"><a class="adv" href="#">高级 ›</a><button class="apply">应用</button></div>
    </div>
  </div>
</div>

<div class="composer">
  <!-- 变体 C：苛刻弹层（flex + 固定高度 + overflow 裁剪）里的 Radix 式 role=slider -->
  <button class="pill" id="pillC">5.6 Sol <span id="pillCEffort">高</span> ▾</button>
  <div data-radix-popper-content-wrapper id="popC" hidden>
    <div class="popover-content tight" id="popCContent">
      <span class="mock-slider" id="sliderC">
        <span class="mock-track"><span class="mock-range" id="rangeC"></span></span>
        <span class="thumb-wrap" style="position:relative;display:inline-flex"><span class="mock-thumb" id="thumbC" role="slider" tabindex="0"
              aria-valuemin="0" aria-valuemax="3" aria-valuenow="2" aria-label="思考强度"></span></span>
      </span>
      <div class="row"><a class="adv" href="#">高级 ›</a><button class="apply">应用</button></div>
    </div>
  </div>
</div>

<div class="debug" id="debug">debug: —</div>
<div class="debug" id="results"></div>

<script>
// ---- Mock 的「原生」逻辑：模拟 ChatGPT 侧滑杆行为（与被测脚本无关） ----
const EFFORTS = ['低', '中', '高', '最深'];

function setupPopover(pillId, popId) {
  const pill = document.getElementById(pillId);
  const pop = document.getElementById(popId);
  pill.addEventListener('click', () => { pop.hidden = !pop.hidden; });
  return pop;
}

// 变体 A：Radix 风格，仅响应 thumb 上的键盘事件（与真实 Radix Slider 一致）
setupPopover('pillA', 'popA');
const rangeA = document.getElementById('rangeA');
const pillAEffort = document.getElementById('pillAEffort');
function renderA(el) {
  const now = Number(el.getAttribute('aria-valuenow'));
  const max = Number(el.getAttribute('aria-valuemax'));
  rangeA.style.width = `${(now / max) * 100}%`;
  pillAEffort.textContent = EFFORTS[now];
}
const onThumbAKeydown = (e) => {
  const el = e.currentTarget;
  const min = Number(el.getAttribute('aria-valuemin'));
  const max = Number(el.getAttribute('aria-valuemax'));
  let now = Number(el.getAttribute('aria-valuenow'));
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') now = Math.min(max, now + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') now = Math.max(min, now - 1);
  else if (e.key === 'Home') now = min;
  else if (e.key === 'End') now = max;
  else return;
  e.preventDefault();
  el.setAttribute('aria-valuenow', String(now));
  renderA(el);
};
const bindThumbA = (el) => el.addEventListener('keydown', onThumbAKeydown);
bindThumbA(document.getElementById('thumbA'));
renderA(document.getElementById('thumbA'));

// 变体 B：原生 range input
setupPopover('pillB', 'popB');
const sliderB = document.getElementById('sliderB');
const pillBEffort = document.getElementById('pillBEffort');
sliderB.addEventListener('input', () => { pillBEffort.textContent = EFFORTS[Number(sliderB.value)]; });

// 变体 C：苛刻弹层里的 Radix 风格滑杆
setupPopover('pillC', 'popC');
const thumbC = document.getElementById('thumbC');
const rangeC = document.getElementById('rangeC');
const pillCEffort = document.getElementById('pillCEffort');
function renderC() {
  const now = Number(thumbC.getAttribute('aria-valuenow'));
  const max = Number(thumbC.getAttribute('aria-valuemax'));
  rangeC.style.width = `${(now / max) * 100}%`;
  pillCEffort.textContent = EFFORTS[now];
}
thumbC.addEventListener('keydown', (e) => {
  const min = Number(thumbC.getAttribute('aria-valuemin'));
  const max = Number(thumbC.getAttribute('aria-valuemax'));
  let now = Number(thumbC.getAttribute('aria-valuenow'));
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') now = Math.min(max, now + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') now = Math.max(min, now - 1);
  else if (e.key === 'Home') now = min;
  else if (e.key === 'End') now = max;
  else return;
  e.preventDefault();
  thumbC.setAttribute('aria-valuenow', String(now));
  renderC();
});
renderC();

// debug 面板：展示两个原生滑杆的实时值，便于确认被测脚本确实驱动了它们
const debug = document.getElementById('debug');
setInterval(() => {
  const a = document.getElementById('thumbA');
  debug.textContent =
    `debug: A.aria-valuenow = ${a.getAttribute('aria-valuenow')} （${EFFORTS[Number(a.getAttribute('aria-valuenow'))]}）` +
    ` | B.value = ${sliderB.value} （${EFFORTS[Number(sliderB.value)]}）`;
}, 300);

// ---- 无头冒烟辅助：?open=1 自动打开弹层；?autotest=1 自动断言并把结果写进 document.title ----
const params = new URLSearchParams(location.search);
if (params.get('open') === '1' || params.get('autotest') === '1') {
  document.getElementById('popA').hidden = false;
  document.getElementById('popB').hidden = false;
  document.getElementById('popC').hidden = false;
}
if (params.get('autotest') === '1') {
  const results = [];
  const check = (name, actual, expected) => results.push(`${name}:${String(actual) === String(expected) ? 'PASS' : `FAIL(got ${actual}, want ${expected})`}`);
  const setLiang = (pop, value) => {
    const r = pop.querySelector('.liangc-range');
    if (!r) return false;
    r.value = String(value);
    r.dispatchEvent(new Event('input', { bubbles: true }));
    return true;
  };
  const finalize = () => {
    document.title = results.every((r) => r.includes('PASS')) ? 'ALL_PASS' : 'SOME_FAIL';
    document.getElementById('results').textContent = results.join(' | ');
  };
  setTimeout(() => {
    try {
      const popA = document.getElementById('popA');
      const popB = document.getElementById('popB');
      const thumbA = document.getElementById('thumbA');
      check('panelA.injected', !!popA.querySelector('.liangc-root'), true);
      check('panelB.injected', !!popB.querySelector('.liangc-root'), true);
      check('nativeA.hidden', !!popA.querySelector('.liangc-native-hidden'), true);
      check('nativeB.hidden', !!popB.querySelector('.liangc-native-hidden'), true);
      // 初始同步：原生当前档位 2/4 → 反向映射应为 20（round(2*30/3)）
      check('panelA.syncedLevel', popA.querySelector('.liangc-range')?.value, '20');
      // 拖到 30（梁祖）→ 原生应到最高档 3
      setLiang(popA, 30);
      check('driveA.max', thumbA.getAttribute('aria-valuenow'), '3');
      setLiang(popB, 30);
      check('driveB.max', sliderB.value, '3');
      // 拖到 0（小难梁）→ 原生应到最低档 0
      setLiang(popA, 0);
      check('driveA.min', thumbA.getAttribute('aria-valuenow'), '0');
      setLiang(popB, 0);
      check('driveB.min', sliderB.value, '0');
      // 中间档：15 → floor(15*4/31)=1 → 原生效能 1（中）
      setLiang(popA, 15);
      check('driveA.mid', thumbA.getAttribute('aria-valuenow'), '1');
      // 人像帧与阶段标注
      check('panelA.stage', popA.querySelector('.liangc-stage')?.textContent, '梁圣');
      check('panelA.canvasDrawn', (popA.querySelector('.liangc-canvas')?.width || 0) > 0, true);
      // 变体 C：苛刻弹层（flex + 固定高度 + overflow 裁剪）下面板必须完整展开
      const popC = document.getElementById('popC');
      const popCContent = document.getElementById('popCContent');
      const thumbC = document.getElementById('thumbC');
      check('panelC.injected', !!popC.querySelector('.liangc-root'), true);
      check('panelC.ancestorRelaxed', popCContent.classList.contains('liangc-relaxed'), true);
      const canvasWrapC = popC.querySelector('.liangc-canvasWrap');
      check('panelC.canvasNotSquished', canvasWrapC ? (canvasWrapC.clientHeight > 100 ? 'ok' : `h=${canvasWrapC.clientHeight}`) : 'missing', 'ok');
      // thumb 外裹了一层 thumb-wrap：多爬逻辑应把整个 .mock-slider 藏掉（包括轨道）
      check('nativeC.wholeSliderHidden', document.getElementById('sliderC').classList.contains('liangc-native-hidden'), true);
      check('nativeC.trackGone', popC.querySelector('.mock-track').offsetParent === null, true);
      // 弹层卡片被撑宽到能装下面板
      check('panelC.popoverWidened', popCContent.getBoundingClientRect().width >= 264, true);
      setLiang(popC, 30);
      check('driveC.max', thumbC.getAttribute('aria-valuenow'), '3');

      // ---- 第二阶段：模拟 React 重渲染把原生滑杆换成新节点（真实站点已证实此行为）----
      const oldThumb = document.getElementById('thumbA');
      const newThumb = oldThumb.cloneNode(true);
      newThumb.setAttribute('aria-valuenow', '1');
      bindThumbA(newThumb); // React 会给新节点绑上它自己的事件（mock 里手动复刻）
      const sliderRootA = document.getElementById('sliderA');
      sliderRootA.classList.remove('liangc-native-hidden'); // React 重建的 DOM 没有我们的隐藏类
      oldThumb.parentNode.replaceChild(newThumb, oldThumb);
      setTimeout(() => {
        try {
          // MutationObserver 触发自愈：新节点应被重新隐藏，面板应还挂着
          check('healA.rehidden', sliderRootA.classList.contains('liangc-native-hidden'), true);
          check('healA.panelSurvives', !!popA.querySelector('.liangc-root'), true);
          // 惰性解析：继续拖动应驱动新节点而不是死掉的旧节点
          setLiang(popA, 30);
          check('healA.driveNewNode', newThumb.getAttribute('aria-valuenow'), '3');
        } catch (err) {
          results.push(`EXCEPTION2:${err && err.message}`);
        }
        finalize();
      }, 600);
    } catch (err) {
      results.push(`EXCEPTION:${err && err.message}`);
      finalize();
    }
  }, 1500);
}
</script>

<!-- 被测脚本：默认以本地帧源直引 userscript；?noembed=1 时不自引（用于扩展版冒烟，改由扩展注入） -->
<script>
if (!new URLSearchParams(location.search).has('noembed')) {
  window.__LIANG_FRAME_BASE__ = '../frames/';
  document.write('<script src="../liang-saint-slider.user.js"><\/script>');
}
</script>
</body>
</html>
