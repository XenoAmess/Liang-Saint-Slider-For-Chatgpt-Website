<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>滑动变祖器 · 商店素材</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; background: #fbfbfb; }
  /* 裁取仓库已有的真实效果截图，保留原始比例，去掉浏览器工具栏与桌面。 */
  .screenshot { position: absolute; width: 1920px; height: 1080px; left: -490px; top: -260px; }
  .promo { display: none; width: 440px; height: 280px; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0, #5e49a7, transparent 75%), #171529; color: #fff; }
  .faces { position: absolute; top: 26px; left: 38px; display: flex; gap: 14px; align-items: center; }
  .faces img { width: 112px; height: 112px; border-radius: 16px; object-fit: cover;
    border: 1px solid #ffffff40; box-shadow: 0 10px 24px #0006; }
  .faces img:first-child { transform: rotate(-7deg); }
  .faces img:last-child { transform: rotate(7deg); }
  .brand { position: absolute; top: 160px; width: 100%; text-align: center; font-size: 28px;
    font-weight: 700; letter-spacing: 4px; }
  .subtitle { position: absolute; top: 204px; width: 100%; text-align: center; font-size: 14px; color: #d1cbed; }
  .track { position: absolute; left: 58px; right: 58px; top: 248px; height: 6px; background: #ffffff30; border-radius: 9px; }
  .track::before { content: ""; display: block; width: 78%; height: 100%; border-radius: inherit; background: #a59aff; }
  .track::after { content: ""; position: absolute; left: calc(78% - 8px); top: -5px; width: 16px; height: 16px;
    border-radius: 50%; background: #dcd6ff; box-shadow: 0 0 0 4px #a59aff25; }
  body[data-asset="promo"] .screenshot { display: none; }
  body[data-asset="promo"] .promo { display: block; }
</style>
<img class="screenshot" src="../images/screenshot01.png" alt="ChatGPT 页面中的滑动变祖器实际效果">
<div class="promo">
  <div class="faces">
    <img src="../frames/frame-00.webp" alt="小难梁">
    <img src="../frames/frame-15.webp" alt="梁圣">
    <img src="../frames/frame-30.webp" alt="梁祖">
  </div>
  <div class="brand">滑动变祖器</div>
  <div class="subtitle">ChatGPT 思考滑杆</div>
  <div class="track"></div>
</div>
<script>document.body.dataset.asset = new URLSearchParams(location.search).get('asset') || 'screenshot';</script>
</html>
